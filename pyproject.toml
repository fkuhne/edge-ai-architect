[project]
name = "edge-ai-architect"
version = "0.1.0"
description = "A local edge-ML learning curriculum: portable benchmarking, compression, and on-device inference"
requires-python = ">=3.10"

# Core stays deliberately tiny. `edgebench` must import and run with nothing but
# stdlib + psutil, so that measurement never depends on the framework being measured
# and so a fresh phase env costs megabytes rather than gigabytes.
dependencies = [
    "psutil>=5.9",
]

# Heavy dependencies are opt-in, per phase. On a small disk, installing every
# backend at once is not an option -- see `make env-<phase>` in the Makefile.
[project.optional-dependencies]
# Phase 1: training + compression
torch = [
    "torch>=2.2",
    "torchvision>=0.17",
]
# Phase 2: portable export + inference
onnx = [
    "onnx>=1.15",
    "onnxruntime>=1.17",
    "optimum>=1.17",
]
# Phase 3+: HuggingFace stack
hf = [
    "transformers>=4.38",
    "datasets>=2.17",
    "accelerate>=0.27",
    "peft>=0.9",
]
# Phase 3: classification metrics for the architecture bake-off
nlp = [
    "scikit-learn>=1.4",
]
# Reporting
viz = [
    "matplotlib>=3.8",
]
# Optional, Darwin-only comparison backends. Never required by the core path.
apple = [
    "coremltools>=7.1",
    "mlx>=0.9",
    "mlx-lm>=0.10",
]
# Optional, CUDA-only. Present so the dependency story is explicit, not because
# it installs here.
cuda = [
    "pynvml>=11.5",
]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["edgebench", "runners"]

[tool.pytest.ini_options]
testpaths = ["tests", "edgebench"]
